# EKS Upgrade Configuration
# Source of truth for target versions. Update this file when planning a new EKS upgrade.
# See: chris/docs/EKS-v1.33-and-Datadog-operator-playbook.md
#
# Usage (run one step at a time):
#   cc eks upgrade --step 1   # First add-ons (terraform.tfvars only)
#   cc eks upgrade --step 2   # EKS control plane + module + provider
#   cc eks upgrade --step 3   # Remaining add-ons + eks.tf configs (external-dns, metrics-server)

target:
  # EKS cluster control plane version
  cluster_version: "1.33"
  # EKS Terraform module version (pkg.udemy.dev/terraform-modules__udemy/eks/aws)
  eks_module_version: "31.66.1"
  # AWS provider version constraint (versions.tf)
  aws_provider_version: ">= 5.83"
  # Bottlerocket configuration update
  ami_type: "BOTTLEROCKET_x86_64"
  # EKS add-on versions (terraform.tfvars eks_addons_versions)
  eks_addons_versions:
    coredns: "v1.12.2-eksbuild.4"
    vpc-cni: "v1.19.6-eksbuild.1"
    kube-proxy: "v1.33.7-eksbuild.2"
    aws-ebs-csi-driver: "v1.45.0-eksbuild.2"
    aws-efs-csi-driver: "v2.1.4-eksbuild.1"
    metrics-server: "v0.8.0-eksbuild.1"
    external-dns: "v0.20.0-eksbuild.1"

# Clusters managed by Stencil (main-dev, skaffold-dev, tooling-dev).
# For 1.34+, Stencil templates must be updated; for current upgrades, edits go to terraform.tfvars.
stencil_clusters:
  - tooling-dev-useast1-green
  - main-dev-useast1-green
  - main-dev-useast1-blue
  - skaffold-dev-useast1-green
  - skaffold-dev-useast1-blue

scope:
  - labs-control-mx-prod-useast1-green
  - labs-evaluators-mx-prod-useast1-green
  - labs-evaluators-ub-prod-useast1-green
  - tooling-prod-useast1-green

# Step definitions - which changes belong to each PR/apply cycle
steps:
  step1:
    description: "fix(eks): First add-ons update and version stubs"
    addons: [coredns, vpc-cni, metrics-server, external-dns]
    # All clusters use coredns v1.11.4 in step 1, step to v1.12.2 in step 3
    addon_overrides:
      coredns: "v1.11.4-eksbuild.28"
  step2:
    description: "fix(eks): EKS v1.33 upgrade"
    cluster_version: true
    eks_module_version: true
    aws_provider_version: true
    local_tf_bottlerocket:
      find: 'platform      = "bottlerocket"'
      replace: 'ami_type      = "BOTTLEROCKET_x86_64"'
  step3:
    description: "fix(eks): Remaining EKS add-ons and configuration blocks"
    addons: [coredns, kube-proxy, aws-ebs-csi-driver, aws-efs-csi-driver]
    eks_tf_note: "Add old_cluster=false, external_dns_config, metrics_server_addons_config to kubernetes_addons module. Labs clusters: add ebs_csi_snapshotter_512mi inside amazon_eks_aws_ebs_csi_driver_config."
    # Cluster name prefixes that should use external_dns sources without istio-gateway (labs has no Istio)
    external_dns_exclude_istio_gateway_clusters: ["labs-"]
    # Cluster name prefixes that need ebs-csi snapshotter 512Mi (prevents OOMKill at default 256Mi)
    ebs_csi_snapshotter_512mi_clusters: ["labs-"]
    eks_tf_blocks:
      old_cluster:
        content: "old_cluster = false"
      external_dns_config:
        content: |
          external_dns_config = {
            addon_version = var.eks_addons_versions.external-dns.version
            configuration_values = {
              txtOwnerId   = local.name_prefix
              policy       = "sync"
              txtPrefix    = "txt-"
              sources      = ["service", "ingress", "istio-gateway"]
              nodeSelector = { worker_group = "managed" }
              tolerations = [
                { key = "worker_group", value = "managed", effect = "NoSchedule" }
              ]
            }
          }
      external_dns_config_no_istio:
        content: |
          external_dns_config = {
            addon_version = var.eks_addons_versions.external-dns.version
            configuration_values = {
              txtOwnerId   = local.name_prefix
              policy       = "sync"
              txtPrefix    = "txt-"
              sources      = ["service", "ingress"]
              nodeSelector = { worker_group = "managed" }
              tolerations = [
                { key = "worker_group", value = "managed", effect = "NoSchedule" }
              ]
            }
          }
      metrics_server_addons_config:
        content: |
          metrics_server_addons_config = {
            addon_version = var.eks_addons_versions.metrics-server.version
            configuration_values = jsonencode({
              nodeSelector = { "worker_group" = "managed" }
              tolerations = [
                { key = "worker_group", value = "managed", effect = "NoSchedule" }
              ]
            })
          }
      ebs_csi_snapshotter_512mi:
        content: |
          # Add inside amazon_eks_aws_ebs_csi_driver_config configuration_values jsonencode, after controller block:
          sidecars = {
            snapshotter = {
              resources = {
                limits = {
                  memory = "512Mi"
                }
              }
            }
          }